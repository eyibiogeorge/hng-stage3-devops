services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blue
      - green
    networks:
      - app_net

  blue:
  image: yimikaade/wonderful:devops-stage-two
  container_name: blue-app
  restart: unless-stopped
  environment:
    - APP_ENV=blue
  expose:
    - "80"
  ports:
    - "8081:80"
  networks:
    - app_net

green:
  image: yimikaade/wonderful:devops-stage-two
  container_name: green-app
  restart: unless-stopped
  environment:
    - APP_ENV=green
  expose:
    - "80"
  ports:
    - "8082:80"
  networks:
    - app_net

networks:
  app_net:
    driver: bridge
